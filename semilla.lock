# semilla.lock — qué archivos están congelados y con qué contenido.
#
# GENERADO por `semilla/sellar.py` de coipo_master_produccion. No se edita a mano.
#
# Lo consume el juez `j12` sobre cada aplicación de la flota: si un archivo de
# esta lista existe en la aplicación con otro contenido, alguien editó una pieza
# congelada y el despliegue lo dice. Que el archivo NO exista no es un hallazgo:
# no toda aplicación usa todas las piezas.
#
# El hash es del contenido con `\r\n` normalizado a `\n`. Sin eso, el juez
# fallaría en cada checkout de Windows por un motivo que no es el contenido, y
# un juez que falla por algo que no importa se suprime en una semana.
