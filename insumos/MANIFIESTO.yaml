  - "El repositorio es publico segun la evidencia de origen y el README lo justifica de forma explicita [README.md]. Que no exista ningun secreto en el historial completo es [VERIFICAR], no algo que este manifiesto pueda cerrar."
  - "Ninguno de los archivos anteriores esta declarado como no versionable, y ninguno se marco con contiene_pii confirmado. Si esa marca cambiara para alguno, la ruta tendria que quedar excluida del control de versiones anclada con barra inicial; comprobarlo y, en su caso, levantarlo como hallazgo corresponde al informe, no a este documento."
