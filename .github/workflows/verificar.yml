# Verificación COIPO — workflow reusable.
#
# Se invoca desde el ci.yml de cada app:
#
#     jueces:
#       uses: Sud-Austral/coipo_jueces/.github/workflows/verificar.yml@v2
#       with:
#         modo: advisory        # advisory | bloqueante
#         perfil: aplicacion    # aplicacion | encuadre_operativo
#
# POR QUÉ REUSABLE Y NO COPIADO
#   Está medido en esta flota: `DOCKER.md` vive en 10 repos con 3 contenidos
#   distintos, y `guia-8-prompt-checklist-pre-deploy.md` tiene 11 puntos en el
#   repo maestro y 9 en COIPO_ENTREGA_PLANTA — al único repo sin CI le faltan
#   justo los dos puntos que más caros salieron. Tasa de propagación del
#   mecanismo copia: 2 de 9 (22 %). Tasa del `uses:`: 8 de 8. Con bus factor 1,
#   el artefacto correcto es el que funciona sin operador disciplinado.
#
# POR QUÉ ESTE REPOSITORIO ES PÚBLICO
#   Un reusable alojado en un repo privado obliga a cablear un PAT de
#   organización en cada repo llamante. El historial de esta flota con secretos
#   de larga vida es un `.env` versionado desde abril: no se añade otro. Los
#   jueces son Python de biblioteca estándar y no llevan secretos, así que
#   publicarlos no expone nada. Los hallazgos, el registro de puertos y los
#   decretos siguen privados en `coipo_master_produccion`.

name: Verificar COIPO

on:
  workflow_call:
    inputs:
      modo:
        description: "advisory (informa, sale 0) | bloqueante (rompe el build)"
        type: string
        default: advisory
      perfil:
        description: "aplicacion | encuadre_operativo"
        type: string
        default: aplicacion
      jueces:
        description: "Lista separada por espacios (p. ej. 'j01 j09'). Vacío = todos los del perfil."
        type: string
        default: ""
      ref_jueces:
        description: >-
          Tag o SHA de coipo_jueces con el que verificar. Por defecto, la MAYOR
          a la que pertenece este YAML. Pasalo explicito para fijar el motor a un
          commit concreto: es lo que hace coipo_prensa2, y es lo unico que hace
          que un pin a SHA congele de verdad las dos mitades.
        type: string
        default: v2
    outputs:
      bloqueantes:
        description: "Número de hallazgos de severidad BLOQUEA."
        value: ${{ jobs.verificar.outputs.bloqueantes }}
      supresiones:
        description: "Supresiones activas. Si crece respecto de main, el juez se está apagando."
        value: ${{ jobs.verificar.outputs.supresiones }}

permissions:
  contents: read

jobs:
  verificar:
    name: jueces (${{ inputs.modo }})
    runs-on: ubuntu-latest
    # Sin timeout, un juez con un bucle infinito encola todos los despliegues
    # siguientes: la concurrencia de esta flota nunca cancela en las ramas que
    # despliegan.
    timeout-minutes: 10
    outputs:
      bloqueantes: ${{ steps.correr.outputs.bloqueantes }}
      supresiones: ${{ steps.correr.outputs.supresiones }}
    steps:
      # Sin `repository:`, checkout trae el repositorio LLAMANTE. Es lo que se
      # quiere: el sujeto de la verificación es la app, no los jueces.
      - name: Repositorio a verificar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · 2026-09-05
        with:
          # `git ls-files` lee el índice, no el historial: un clon superficial
          # basta y ahorra minutos en repos con muchos commits.
          fetch-depth: 1

      # EL MOTOR VIENE DE LA MISMA REFERENCIA QUE EL YAML, y eso arregla un
      # defecto que costo un diagnostico entero.
      #
      # Este workflow descarga el CODIGO de los jueces en un segundo checkout.
      # Hasta el 2026-09-08, la referencia de ese checkout era `ref_jueces`, con
      # `v1` por defecto -- un tag MOVIL. Consecuencia medida en coipo_prensa2:
      # fijar el `uses:` a un SHA congelaba el YAML y NO el codigo, asi que el
      # comentario que decia "si un @v1 movido la pusiera roja, no se sabria si
      # fallo la regla o el codigo" era falso. Y al publicar v2 habria sido peor:
      # quien usara @v2 habria ejecutado el YAML de v2 con los jueces de v1.
      #
      # SE INTENTO DEDUCIRLO DE `github.job_workflow_ref` Y NO SE PUEDE. Medido el
      # 2026-09-08 en una ejecucion real: ese campo llega VACIO en los pasos de un
      # workflow reusable. Existe en las reclamaciones del token OIDC, no en el
      # contexto `github` que ve `run:`. La ejecucion fallo, y fallo RUIDOSAMENTE,
      # que era justo el punto de la comprobacion de mas abajo: si hubiera caido a
      # un valor por defecto en silencio, el gate habria verificado con un motor
      # que nadie eligio.
      #
      # Asi que el defecto se cierra por las dos vias que si funcionan:
      #   - el valor por defecto es la MAYOR de este YAML, y una prueba de este
      #     repositorio comprueba que no se quede atras (tests/test_verificar_yaml.py);
      #   - quien quiera garantia total pasa `ref_jueces` explicito junto al SHA del
      #     `uses:`, que es lo que hace coipo_prensa2.
      - name: Con que version de los jueces se verifica
        id: motor
        env:
          PEDIDO: ${{ inputs.ref_jueces }}
          PROPIO: ${{ github.job_workflow_ref }}
          MODO: ${{ inputs.modo }}
          PERFIL: ${{ inputs.perfil }}
          SOLO: ${{ inputs.jueces }}
        run: |
          # Nombre de artefacto UNICO por invocacion. Con `jueces-${{ github.job }}-N`
          # dos llamadas a este reusable en el mismo run (advisory y bloqueante, o
          # dos perfiles) chocaban con 409 en 'Guardar los hallazgos'.
          etiqueta=$(printf '%s' "${SOLO:-todos}" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')
          echo "artefacto=jueces-${MODO}-${PERFIL}-${etiqueta:-todos}-${GITHUB_RUN_ATTEMPT:-1}" >> "$GITHUB_OUTPUT"
          if [ -n "$PEDIDO" ]; then
            ref="$PEDIDO"
            origen="el input ref_jueces"
          else
            ref="${PROPIO##*@}"
            ref="${ref#refs/tags/}"
            ref="${ref#refs/heads/}"
            origen="la referencia del propio reusable ($PROPIO)"
          fi
          if [ -z "$ref" ]; then
            echo "::error::No se pudo determinar con que version de los jueces verificar."
            echo "  job_workflow_ref='$PROPIO'  ref_jueces='$PEDIDO'"
            echo "  Un gate que no sabe que codigo esta ejecutando no verifica nada."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Jueces: $ref  (de $origen)"

      - name: Los jueces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · 2026-09-05
        with:
          repository: Sud-Austral/coipo_jueces
          ref: ${{ steps.motor.outputs.ref }}
          path: .coipo_jueces
          fetch-depth: 1

      # No hay `setup-python`: los jueces son de biblioteca estándar a
      # propósito, así que el python del runner sirve. Es un minuto menos por
      # ejecución y una dependencia menos que puede caerse.
      - name: Versión de python
        run: python3 --version

      - name: Correr los jueces
        id: correr
        env:
          PYTHONIOENCODING: utf-8
          # Un solo `env:`. v2.0.3 llevaba DOS en este paso: PyYAML se queda con el
          # ultimo sin avisar y GitHub rechaza el archivo entero -- ningun consumidor
          # de @v2 pudo correr. tests/test_workflows_yaml.py lo impide desde entonces.
          MODO: ${{ inputs.modo }}
          PERFIL: ${{ inputs.perfil }}
          SOLO: ${{ inputs.jueces }}
        run: |
          # Los inputs entran por `env:` y no como `${{ }}` dentro del shell: un
          # valor con comillas rompia el script antes de llegar a correr.py, y uno
          # con `$(...)` se EJECUTABA. El paso motor ya lo hacia asi.
          # `run:` se ejecuta con `bash -e`: si correr.py sale distinto de 0, el
          # paso aborta EN ESA LÍNEA. Sin el `|| codigo=$?`, el modo bloqueante
          # nunca llegaría a las salidas del job ni al resumen — justo cuando
          # hacen falta. Las salidas las escribe correr.py en $GITHUB_OUTPUT.
          codigo=0
          python3 .coipo_jueces/jueces/correr.py \
            --repo . \
            --modo "$MODO" \
            --perfil "$PERFIL" \
            --jueces "$SOLO" \
            --resumen "$RUNNER_TEMP/RESUMEN.md" \
            --json "$RUNNER_TEMP/hallazgos.json" || codigo=$?
          exit $codigo

      # `always()`: el resumen es MÁS útil cuando el paso anterior falló. Sin
      # esto, el modo bloqueante deja al que mira el build sin la lista de lo
      # que hay que arreglar, que es justo cuando la necesita.
      - name: Publicar el resumen
        if: always()
        run: cat "$RUNNER_TEMP/RESUMEN.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar los hallazgos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 · 2026-09-05
        with:
          name: ${{ steps.motor.outputs.artefacto }}
          path: |
            ${{ runner.temp }}/RESUMEN.md
            ${{ runner.temp }}/hallazgos.json
          if-no-files-found: warn
          retention-days: 30
